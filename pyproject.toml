[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-scraper-getbro"
version = "1.2.0"
description = "An apify/instagram-scraper work-alike powered by the getbro.ws stealth browser"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["instagram", "scraper", "apify", "getbro", "browser-automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Intended Audience :: Developers",
]
# every getbro call goes through the official SDK (requests + pydantic underneath)
dependencies = ["bro-api-sdk>=0.1.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
instagram-scraper = "instagram_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
